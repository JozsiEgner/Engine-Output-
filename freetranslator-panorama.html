<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FreeTranslator · Belső Panoráma ⬡</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000008;overflow:hidden;font-family:'Courier New',monospace;touch-action:none}
    #c{position:fixed;top:0;left:0;width:100vw;height:100vh}

    /* ── Top bar ── */
    #topbar{
      position:fixed;top:0;left:0;right:0;z-index:100;
      padding:9px 16px;
      background:linear-gradient(180deg,rgba(0,3,14,.93) 0%,transparent 100%);
      display:flex;align-items:center;gap:12px;
      backdrop-filter:blur(4px);
      border-bottom:1px solid rgba(100,160,220,.08);
    }
    .logo{font-size:12px;color:#78c4ff;letter-spacing:3px;font-weight:700;white-space:nowrap}
    .bd{
      background:rgba(4,12,36,.82);
      border:1px solid rgba(100,160,220,.22);
      border-radius:3px;padding:3px 8px;
      font-size:11px;color:#88aac8;letter-spacing:.5px;white-space:nowrap;
    }
    .bd.on{border-color:rgba(100,220,140,.28);color:#70c890}
    #sp{flex:1}
    .tlink{
      color:#78c4ff;font-size:11px;text-decoration:none;
      padding:3px 8px;border:1px solid rgba(100,160,220,.22);border-radius:3px;
    }
    .tlink:hover{border-color:rgba(120,196,255,.5)}

    /* ── Crosshair ── */
    #xh{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      pointer-events:none;z-index:50;
    }
    #xh::before,#xh::after{content:'';position:absolute;background:rgba(120,196,255,.3)}
    #xh::before{width:1px;height:44px;left:0;top:-22px}
    #xh::after {width:44px;height:1px;left:-22px;top:0}
    #xh-ring{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      width:18px;height:18px;border-radius:50%;
      border:1px solid rgba(120,196,255,.25);
      pointer-events:none;z-index:50;
    }

    /* ── Bottom bar ── */
    #botbar{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      padding:7px 16px;
      background:linear-gradient(0deg,rgba(0,3,14,.93) 0%,transparent 100%);
      display:flex;align-items:center;gap:18px;
      font-size:10px;color:#3a5068;
    }

    /* ── Direction floating labels ── */
    .dlbl{
      position:fixed;z-index:60;pointer-events:none;
      transform:translate(-50%,-50%);text-align:center;line-height:1.5;
      transition:opacity .15s;
    }
    .dlbl-name{font-size:24px;font-weight:700;letter-spacing:3px;
      text-shadow:0 0 16px currentColor,0 0 32px currentColor}
    .dlbl-pct {font-size:14px;font-weight:700}
    .dlbl-sub {font-size:9px;letter-spacing:1px;opacity:.65}

    /* ── AGY Compare side panel ── */
    #agy{
      position:fixed;right:14px;top:52px;z-index:110;
      width:290px;max-height:calc(100vh - 80px);overflow-y:auto;
      background:rgba(0,5,18,.9);
      border:1px solid rgba(100,160,220,.2);
      border-radius:6px;padding:12px;
      font-size:10px;display:none;
    }
    #agy.open{display:block}
    #agy h3{color:#78c4ff;font-size:11px;letter-spacing:1.5px;margin-bottom:10px}
    .agy-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .agy-card{
      background:rgba(0,10,30,.6);border-radius:4px;padding:8px;
    }
    .agy-card.py{border-top:2px solid #8be28b}
    .agy-card.jv{border-top:2px solid #d7a7ff}
    .agy-src{font-size:9px;letter-spacing:1px;font-weight:700;margin-bottom:5px}
    .agy-val{color:#90b8d8;line-height:1.6}

    /* TTS bar */
    #tts-bar{
      position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
      z-index:110;display:flex;gap:8px;align-items:center;
      background:rgba(0,5,18,.88);border:1px solid rgba(100,160,220,.18);
      border-radius:20px;padding:6px 16px;
      font-size:11px;transition:opacity .4s;
    }
    #tts-bar.hidden{opacity:0;pointer-events:none}
    #tts-text{
      background:transparent;border:none;outline:none;
      color:#90b8d8;font-family:inherit;font-size:11px;
      width:260px;
    }
    .tts-btn{
      background:rgba(120,196,255,.12);border:1px solid rgba(120,196,255,.25);
      border-radius:10px;padding:3px 10px;color:#78c4ff;cursor:pointer;font-family:inherit;font-size:10px;
    }
    .tts-btn:hover{background:rgba(120,196,255,.22)}
    #tts-indicator{width:8px;height:8px;border-radius:50%;background:#3a5068;transition:background .3s}
    #tts-indicator.speaking{background:#8be28b;box-shadow:0 0 6px #8be28b}
  </style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="topbar">
  <span class="logo">⬡ BELSŐ PANORÁMA</span>
  <span class="bd" id="b-ang">⊕ 0.0°</span>
  <span class="bd" id="b-th">🌡 HŰVÖS</span>
  <span class="bd" id="b-int">∫ 0.000</span>
  <span class="bd" id="b-stp">⟳ 0</span>
  <span id="sp"></span>
  <button class="tlink" id="agy-tog" onclick="toggleAgy()" style="font-family:inherit;cursor:pointer;background:rgba(4,12,36,.82)">⊻ AGY</button>
  <button class="tlink" id="tts-tog" onclick="toggleTts()" style="font-family:inherit;cursor:pointer;background:rgba(4,12,36,.82)">🔊 TTS</button>
  <button class="tlink" id="spin-tog" onclick="toggleSpin()" style="font-family:inherit;cursor:pointer;background:rgba(4,12,36,.82)">↺ Forog</button>
  <a href="/freetranslator-v2.1.html" class="tlink">← UI</a>
</div>

<div id="xh"></div>
<div id="xh-ring"></div>
<div id="dir-labels"></div>

<!-- AGY compare panel -->
<div id="agy">
  <h3>⊻ Python AGY vs Java AGY</h3>
  <div class="agy-grid">
    <div class="agy-card py">
      <div class="agy-src" style="color:#8be28b">PYTHON :3001</div>
      <div class="agy-val" id="py-val">—</div>
    </div>
    <div class="agy-card jv">
      <div class="agy-src" style="color:#d7a7ff">JAVA :3002</div>
      <div class="agy-val" id="jv-val">—</div>
    </div>
  </div>
  <div style="color:#506070;font-size:9px;letter-spacing:.5px;margin-bottom:6px">
    NAPLÓ – utolsó 20 bejegyzés
  </div>
  <div id="agy-log" style="max-height:280px;overflow-y:auto;line-height:1.6;font-size:9px;color:#405060"></div>
</div>

<!-- TTS bar (Szabolcs) -->
<div id="tts-bar" class="hidden">
  <div id="tts-indicator"></div>
  <input id="tts-text" type="text" placeholder="Szabolcs hangja – írj szöveget...">
  <button class="tts-btn" onclick="speakText()">▶ Olvas</button>
  <button class="tts-btn" onclick="stopSpeech()">■</button>
</div>

<div id="botbar">
  <span id="b-look">Lon: 0.0° / Lat: 0.0°</span>
  <span id="b-fps">— fps</span>
  <span style="color:#28404c">⟵ Húzás·Görgő·Touch = navigáció</span>
  <span style="flex:1"></span>
  <span id="b-con" style="color:#304838">● offline</span>
</div>

<!-- Three.js r134 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
(function(){
'use strict';

// ── Renderer ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(80, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 0, 0);

// ── Equirectangular canvas texture ────────────────────────────────────────────
const TW = 2048, TH = 1024;
const tc  = document.createElement('canvas');
tc.width  = TW; tc.height = TH;
const tx  = tc.getContext('2d');

const panoTex = new THREE.CanvasTexture(tc);

// Inside sphere: BackSide + mirror X to fix handedness
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(500, 72, 36),
  new THREE.MeshBasicMaterial({ map: panoTex, side: THREE.BackSide })
);
sphere.scale.x = -1;   // mirror: fixes left/right for inside-viewing
scene.add(sphere);

// ── Directions ────────────────────────────────────────────────────────────────
const DIRS = [
  {key:'north', name:'É',  lon:  0, color:'#78c4ff', label:'Kék pillér'    },
  {key:'east',  name:'K',  lon: 90, color:'#8be28b', label:'Zöld pillér'   },
  {key:'south', name:'D',  lon:180, color:'#ff9b9b', label:'Vörös pillér'  },
  {key:'west',  name:'Ny', lon:270, color:'#d7a7ff', label:'Ibolya pillér' },
];

// ── State ─────────────────────────────────────────────────────────────────────
const st = {
  step:0, reticle:0, energy:.2,
  cols: null,
  dist: {north:40,east:24,south:18,west:18},
  integ:.85,
  thermal:{label:'HŰVÖS',color:'#78c4ff'},
};

// ── Camera orbit (inside-sphere) ──────────────────────────────────────────────
// yaw=π/2 → looking at North (lon=0°)
// drag right → yaw decreases → see East → natural inside-sphere navigation
let yaw   = Math.PI / 2;   // start looking North
let pitch = 0;
let dragging = false, lastMX = 0, lastMY = 0;
let autoSpin = true;
let fov      = 80;

function applyCamera() {
  // Camera look direction in world space
  const lx = Math.cos(pitch) * Math.sin(yaw);
  const ly = Math.sin(pitch);
  const lz = Math.cos(pitch) * Math.cos(yaw);
  camera.lookAt(lx * 499, ly * 499, lz * 499);

  // Current longitude at screen center: camLon = (π/2 - yaw) * 180/π
  const camLon = (((Math.PI/2 - yaw) * 180/Math.PI) % 360 + 360) % 360;
  const latDeg = pitch * 180/Math.PI;
  document.getElementById('b-look').textContent =
    `Lon: ${camLon.toFixed(1)}° / Lat: ${latDeg.toFixed(1)}°`;
}

// Mouse
canvas.addEventListener('mousedown', e=>{
  dragging=true; lastMX=e.clientX; lastMY=e.clientY;
  autoSpin=false; canvas.style.cursor='grabbing';
});
window.addEventListener('mouseup', ()=>{ dragging=false; canvas.style.cursor='grab'; });
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  yaw   -= (e.clientX - lastMX) * 0.004; // negative: drag-right = see-east ✓
  pitch += (e.clientY - lastMY) * 0.003;
  pitch  = Math.max(-Math.PI/2+.05, Math.min(Math.PI/2-.05, pitch));
  lastMX = e.clientX; lastMY = e.clientY;
  applyCamera();
});
window.addEventListener('wheel', e=>{
  fov = Math.max(30, Math.min(110, fov + e.deltaY*.04));
  camera.fov = fov; camera.updateProjectionMatrix();
});

// Touch
let ltx=0, lty=0, ltDist=0;
canvas.addEventListener('touchstart', e=>{
  autoSpin=false;
  if(e.touches.length===1){ ltx=e.touches[0].clientX; lty=e.touches[0].clientY; }
  if(e.touches.length===2){ ltDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
    e.touches[0].clientY-e.touches[1].clientY); }
});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===1){
    yaw   -= (e.touches[0].clientX - ltx) * 0.005;
    pitch += (e.touches[0].clientY - lty) * 0.004;
    pitch  = Math.max(-Math.PI/2+.05, Math.min(Math.PI/2-.05, pitch));
    ltx=e.touches[0].clientX; lty=e.touches[0].clientY;
    applyCamera();
  }
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);
    fov = Math.max(30, Math.min(110, fov - (d-ltDist)*.05));
    camera.fov=fov; camera.updateProjectionMatrix();
    ltDist=d;
  }
}, {passive:false});

// Resize
window.addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

canvas.style.cursor = 'grab';

// ── Texture coordinate helpers ─────────────────────────────────────────────────
function lonToX(deg){ return ((deg%360+360)%360)/360*TW; }
function latToY(deg){ return (1-(deg+90)/180)*TH; }

function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgba(h,a){ const[r,g,b]=hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

// ── Stable starfield ──────────────────────────────────────────────────────────
function mulberry(seed){
  let s=seed;
  return ()=>{ s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296; };
}
const rng = mulberry(20240621);
const STARS = Array.from({length:1200},()=>({x:rng()*TW,y:rng()*TH,r:rng()*1.4+.2,a:rng()*.5+.1}));

// ── Main texture draw ─────────────────────────────────────────────────────────
function drawPano(){
  const t = st.step;

  // 1 · Background gradient
  const bg = tx.createLinearGradient(0,0,0,TH);
  bg.addColorStop(0,   '#000510');
  bg.addColorStop(.45, '#000918');
  bg.addColorStop(.55, '#000918');
  bg.addColorStop(1,   '#000510');
  tx.fillStyle=bg; tx.fillRect(0,0,TW,TH);

  // 2 · Stars (twinkle)
  STARS.forEach(s=>{
    tx.globalAlpha = s.a*(0.65+0.35*Math.sin(t*.025+s.x*.003));
    tx.fillStyle='#fff';
    tx.beginPath(); tx.arc(s.x,s.y,s.r,0,Math.PI*2); tx.fill();
  });
  tx.globalAlpha=1;

  // 3 · 21 harmonic rings (latitude circles)
  for(let lv=0;lv<=20;lv++){
    const lat=-90+lv*9, y=latToY(lat);
    const major = lv%5===0;
    tx.strokeStyle=`rgba(70,130,190,${major?.14:.045})`;
    tx.lineWidth=major?1.5:.5;
    tx.beginPath(); tx.moveTo(0,y); tx.lineTo(TW,y); tx.stroke();

    if(major && lv>0 && lv<20){
      tx.fillStyle='rgba(70,130,190,.25)';
      tx.font='10px Courier New'; tx.textAlign='left';
      tx.fillText(`${lv}`, 6, y-2);
    }
  }

  // 4 · 4 direction pillars
  DIRS.forEach((d,i)=>{
    const cx = lonToX(d.lon);
    const [r,g,b] = hexRgb(d.color);

    // Glow halo (±100px tapering)
    const pg = tx.createLinearGradient(cx-110,0,cx+110,0);
    pg.addColorStop(0,'transparent');
    pg.addColorStop(.3,`rgba(${r},${g},${b},.05)`);
    pg.addColorStop(.5,`rgba(${r},${g},${b},.22)`);
    pg.addColorStop(.7,`rgba(${r},${g},${b},.05)`);
    pg.addColorStop(1,'transparent');
    tx.fillStyle=pg; tx.fillRect(cx-110,0,220,TH);
    // wrap for lon=0
    if(cx<110){ tx.fillRect(TW+cx-110,0,110-cx,TH); }
    if(cx>TW-110){ tx.fillRect(0,0,110-(TW-cx),TH); }

    // Spine
    tx.strokeStyle=rgba(d.color,.6); tx.lineWidth=2;
    tx.beginPath(); tx.moveTo(cx,0); tx.lineTo(cx,TH); tx.stroke();

    // 21 level resonance dots
    const col = st.cols ? st.cols[i] : null;
    for(let lv=0;lv<21;lv++){
      const lat=-80+lv*8, py=latToY(lat);
      const str = col ? col.levels[lv] : (.4+.3*Math.sin(lv*.8+t*.06+i));
      const dr = 2.5 + str*7;
      const pulse = .25+str*.55+.08*Math.sin(t*.18+lv*.4+i*1.1);
      tx.fillStyle=rgba(d.color, Math.min(1,pulse));
      tx.beginPath(); tx.arc(cx,py,dr,0,Math.PI*2); tx.fill();
    }

    // Direction label at equator
    const pct = st.dist[d.key]||25;
    tx.globalAlpha=.9;
    tx.fillStyle=d.color;
    tx.font='bold 26px Courier New'; tx.textAlign='center';
    tx.fillText(`${d.name} · ${pct}%`, cx, TH/2+44);
    tx.font='11px Courier New';
    tx.fillStyle=rgba(d.color,.55);
    tx.fillText(d.label, cx, TH/2+62);
    tx.globalAlpha=1;
  });

  // 5 · Loxodrome spirals (3 interlaced, slowly rotating)
  for(let s=0;s<3;s++){
    const off   = s*120;
    const alpha = .11 - s*.025;
    const thick = s===0 ? 1.8 : 1;
    const spd   = s===0 ? .18 : s===1 ? -.11 : .07;
    tx.strokeStyle=`rgba(80,150,255,${alpha})`;
    tx.lineWidth=thick;
    tx.beginPath();
    let prevX=null;
    for(let step=0;step<=480;step++){
      const frac=step/480;
      const lat=frac*160-80;
      const lon=((frac*4*360+off+t*spd)%360+360)%360;
      const px=lonToX(lon), py=latToY(lat);
      if(prevX!==null && Math.abs(px-prevX)>TW/2){
        tx.stroke(); tx.beginPath(); prevX=null;
      }
      if(prevX===null) tx.moveTo(px,py); else tx.lineTo(px,py);
      prevX=px;
    }
    tx.stroke();
  }

  // 6 · Reticle marker (current angle)
  const rX=lonToX(st.reticle), rY=TH/2;
  const rg=tx.createRadialGradient(rX,rY,0,rX,rY,90);
  rg.addColorStop(0,'rgba(255,240,150,.55)');
  rg.addColorStop(.25,'rgba(255,210,80,.18)');
  rg.addColorStop(1,'transparent');
  tx.fillStyle=rg; tx.beginPath(); tx.arc(rX,rY,90,0,Math.PI*2); tx.fill();

  tx.strokeStyle='rgba(255,235,140,.65)'; tx.lineWidth=1.5;
  tx.beginPath();
  tx.moveTo(rX-40,rY); tx.lineTo(rX+40,rY);
  tx.moveTo(rX,rY-40); tx.lineTo(rX,rY+40);
  tx.stroke();
  tx.strokeStyle='rgba(255,235,140,.28)';
  tx.beginPath(); tx.arc(rX,rY,16,0,Math.PI*2); tx.stroke();

  // 7 · Equator dashed line
  tx.strokeStyle='rgba(60,100,160,.16)'; tx.lineWidth=1;
  tx.setLineDash([12,12]);
  tx.beginPath(); tx.moveTo(0,TH/2); tx.lineTo(TW,TH/2); tx.stroke();
  tx.setLineDash([]);

  // 8 · Pole labels
  tx.fillStyle='rgba(90,150,210,.4)'; tx.font='11px Courier New'; tx.textAlign='center';
  tx.fillText('▲ CSÚCS  szint 20', TW/2, 20);
  tx.fillText('▼ ALAP   szint 0',  TW/2, TH-6);

  panoTex.needsUpdate = true;
}

// ── Direction labels overlay (angular projection) ─────────────────────────────
const lblContainer = document.getElementById('dir-labels');
DIRS.forEach(d=>{
  const el=document.createElement('div');
  el.className='dlbl'; el.id=`dl-${d.key}`;
  el.innerHTML=`<div class="dlbl-name" style="color:${d.color}">${d.name}</div>
    <div class="dlbl-pct" style="color:${d.color}" id="dp-${d.key}">0%</div>
    <div class="dlbl-sub" style="color:${d.color}">${d.label}</div>`;
  lblContainer.appendChild(el);
});

function updateDirLabels(){
  // current center longitude = (π/2 - yaw) * 180/π
  const camLon = (((Math.PI/2 - yaw)*180/Math.PI)%360+360)%360;
  const aspect = innerWidth/innerHeight;
  const hFovDeg = Math.atan(Math.tan(camera.fov*Math.PI/360)*aspect)*360/Math.PI;

  DIRS.forEach(d=>{
    const pctEl = document.getElementById(`dp-${d.key}`);
    if(pctEl) pctEl.textContent = (st.dist[d.key]||0)+'%';

    // Angular difference (−180 to +180)
    let diff = ((d.lon - camLon)+180+360)%360 - 180;
    const screenX = innerWidth/2 + (diff/hFovDeg)*innerWidth;
    const screenY = innerHeight/2 - pitch*(innerHeight/(camera.fov*Math.PI/180));
    const el = document.getElementById(`dl-${d.key}`);

    const visible = Math.abs(diff) < hFovDeg/2 + 30;
    el.style.display  = visible ? 'block' : 'none';
    el.style.left     = screenX+'px';
    el.style.top      = screenY+'px';
    el.style.opacity  = visible ? Math.max(0,1-Math.abs(diff)/(hFovDeg/2+20)) : 0;
  });
}

// ── Animation loop ────────────────────────────────────────────────────────────
let frame=0, lastFpsT=performance.now();

function animate(){
  requestAnimationFrame(animate);
  if(autoSpin){ yaw -= 0.0003; applyCamera(); } // slow eastward drift
  if(frame%2===0) drawPano();
  renderer.render(scene,camera);
  updateDirLabels();
  frame++;
  if(frame%60===0){
    const fps=Math.round(60000/(performance.now()-lastFpsT));
    lastFpsT=performance.now();
    document.getElementById('b-fps').textContent=fps+' fps';
  }
}

// ── Server polling ────────────────────────────────────────────────────────────
async function pollServer(){
  try{
    const [cr,sr]=await Promise.allSettled([
      fetch('/api/columns',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({step:st.step,reticleAngle:st.reticle,matrixEnergy:st.energy*100,tension:.5})}),
      fetch('/api/cortex')
    ]);
    if(cr.status==='fulfilled'&&cr.value.ok){
      const d=await cr.value.json();
      st.cols=d.columns; st.integ=d.structuralIntegrity||d.integrity||.85;
      if(d.correctedDistribution) st.dist=d.correctedDistribution;
      document.getElementById('b-int').textContent=`∫ ${st.integ.toFixed(3)}`;
    }
    if(sr.status==='fulfilled'&&sr.value.ok){
      const d=await sr.value.json();
      st.thermal=d.thermalBand||st.thermal;
      document.getElementById('b-th').textContent=`🌡 ${st.thermal.label}`;
      document.getElementById('b-con').textContent='● online';
      document.getElementById('b-con').style.color='#4a8a4a';
    }
  }catch(e){
    document.getElementById('b-con').textContent='● offline';
    document.getElementById('b-con').style.color='#6a3a3a';
  }
  st.step++; st.reticle=(st.step*137.5077)%360; st.energy=.3+.2*Math.sin(st.step*.07);
  document.getElementById('b-ang').textContent=`⊕ ${st.reticle.toFixed(1)}°`;
  document.getElementById('b-stp').textContent=`⟳ ${st.step}`;
}

// ── AGY compare ───────────────────────────────────────────────────────────────
let agyOpen=false;
window.toggleAgy=function(){
  agyOpen=!agyOpen;
  document.getElementById('agy').classList.toggle('open',agyOpen);
  if(agyOpen) fetchAgys();
};

async function fetchAgys(){
  const check=async(port,id)=>{
    try{
      const r=await fetch(`http://localhost:${port}/status`,{signal:AbortSignal.timeout(2000)});
      const d=await r.json();
      document.getElementById(id).innerHTML=
        `🌡 <b>${d.thermalBand?.label||'?'}</b><br>⟳ ${d.step||0} lépés<br>`+
        `Terhelés: ${((d.load||0)*100).toFixed(0)}%<br>Hő: ${((d.heat||0)*100).toFixed(0)}%`;
    }catch{
      document.getElementById(id).innerHTML='<span style="color:#604040">nem fut</span>';
    }
  };
  await Promise.all([check(3001,'py-val'),check(3002,'jv-val')]);

  // Shared log
  try{
    const r=await fetch('/api/agy-compare');
    if(!r.ok) throw 0;
    const d=await r.json();
    const entries=d.entries||[];
    document.getElementById('agy-log').innerHTML=
      entries.length===0
        ? '<em style="color:#304050">Nincs napló bejegyzés</em>'
        : entries.slice(-20).reverse().map(e=>`
          <div style="padding:2px 0;border-bottom:1px solid rgba(50,70,100,.25)">
            <span style="color:${e.source==='python'?'#8be28b':'#d7a7ff'}">[${e.source}]</span>
            <span style="color:#304858"> ${new Date(e.ts).toLocaleTimeString()}</span>
            <span style="color:#506878"> ${e.action} ${e.ms}ms</span>
            <span style="color:#78c4ff"> ⊕${(e.angle||0).toFixed(0)}°</span>
          </div>`).join('');
  }catch{
    document.getElementById('agy-log').innerHTML='<em style="color:#304050">Napló nem elérhető (/api/agy-compare)</em>';
  }
}

setInterval(()=>{ if(agyOpen) fetchAgys(); }, 6000);

// ── TTS – Microsoft Szabolcs hangja ──────────────────────────────────────────
let ttsVisible=false, synth=window.speechSynthesis;

window.toggleTts=function(){
  ttsVisible=!ttsVisible;
  document.getElementById('tts-bar').classList.toggle('hidden',!ttsVisible);
  if(ttsVisible) loadVoices();
};

let szabolcsVoice=null, fallbackVoice=null;

function loadVoices(){
  const set=()=>{
    const vs=synth.getVoices();
    // Microsoft Szabolcs (Windows/Azure)
    szabolcsVoice=vs.find(v=>v.name.toLowerCase().includes('szabolcs')) || null;
    // Fallback: any Hungarian voice
    fallbackVoice=vs.find(v=>v.lang==='hu-HU'||v.lang==='hu') || null;
    const btn=document.getElementById('tts-tog');
    if(szabolcsVoice){
      btn.textContent='🔊 Szabolcs'; btn.style.color='#8be28b';
    } else if(fallbackVoice){
      btn.textContent='🔊 hu ('+fallbackVoice.name.split(' ')[0]+')'; btn.style.color='#ffc96b';
    } else {
      btn.textContent='🔊 TTS (nincs hu)'; btn.style.color='#ff9b9b';
    }
  };
  set();
  synth.onvoiceschanged=set;
}

window.speakText=function(){
  const text=document.getElementById('tts-text').value.trim();
  if(!text) return;
  stopSpeech();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='hu-HU'; utt.rate=.95; utt.pitch=1.0; utt.volume=1;
  if(szabolcsVoice) utt.voice=szabolcsVoice;
  else if(fallbackVoice) utt.voice=fallbackVoice;
  utt.onstart=()=>document.getElementById('tts-indicator').classList.add('speaking');
  utt.onend=utt.onerror=()=>document.getElementById('tts-indicator').classList.remove('speaking');
  synth.speak(utt);
};

window.stopSpeech=function(){
  synth.cancel();
  document.getElementById('tts-indicator').classList.remove('speaking');
};

// Enter key in TTS box
document.getElementById('tts-text').addEventListener('keydown',e=>{
  if(e.key==='Enter') speakText();
});

applyCamera();
drawPano();
animate();
pollServer();
setInterval(pollServer, 2000);

})();
